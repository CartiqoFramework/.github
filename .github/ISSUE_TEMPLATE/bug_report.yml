name: Bug report
description: Something is broken or does not behave the way it says it does.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please search the existing issues first, and add to that thread if it is already there.

        Security problems do not belong here. Read [SECURITY.md](https://github.com/CartiqoFramework/.github/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Paste the full error text rather than a screenshot of it, where you can.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Enough for someone else to hit the same thing on their own machine.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, bot command, or the commit SHA you are on.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, browser, whatever is relevant.
      placeholder: "Windows 11, Node 22.15, Chrome 140"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
        - label: There are no tokens, passwords or personal data in what I pasted above
          required: true
